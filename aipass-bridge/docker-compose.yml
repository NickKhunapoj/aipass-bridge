services:
  aipass-bridge:
    build: .
    image: aipass-bridge:latest
    container_name: aipass-bridge
    restart: unless-stopped
    ports:
      - "6080:6080"
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:9222:9222"
    volumes:
      - ./chrome-data:/app/chrome-data
      - ./extension:/app/extension
      - ./bridge:/app/bridge
      - ./start-browser.sh:/app/start-browser.sh
      - ./start-vnc.sh:/app/start-vnc.sh
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - AIPASS_PORT=8787
      - AIPASS_HOST=0.0.0.0
      - AIPASS_MODEL=gemini-3.1-flash-lite
      - noVNC_PASSWORD=${noVNC_PASSWORD:-}
      - NOVNC_PASSWORD=${NOVNC_PASSWORD:-}
    shm_size: '2gb'
