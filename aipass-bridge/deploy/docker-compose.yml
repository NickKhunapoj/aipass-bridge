services:
  aipass-bridge:
    build: .
    image: aipass-bridge:latest
    container_name: aipass-bridge
    restart: unless-stopped
    ports:
      # All three are bound to 127.0.0.1 — none is exposed to the network by
      # default. both noVNC and the bridge lack authentication,
      # so reach them over an SSH tunnel rather than opening a public port.
      # If you MUST expose noVNC, change it to "6080:6080" AND set a strong
      # noVNC_PASSWORD in .env first.
      - "127.0.0.1:6080:6080"   # noVNC web desktop
      - "127.0.0.1:8787:8787"   # OpenAI-compatible bridge (no auth)
    volumes:
      - ./chrome-data:/app/chrome-data      # the logged-in browser profile (gitignored)
      - ../extension:/app/extension:ro      # the unmodified core extension
      - ../bridge:/app/bridge:ro            # the unmodified core bridge
      # Startup scripts stay inside the Linux image. Binding Windows copies
      # here changes their line endings and prevents Supervisor from launching
      # x11vnc/Chromium (ENOENT / exit 127).
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - AIPASS_PORT=8787
      - AIPASS_HOST=0.0.0.0
      - AIPASS_MODEL=gemini-3.1-flash-lite
      # The container-management routes (/restart, /logs, /browser/restart,
      # /ext/reload, /tab/reload) exist only here, not in a local run.
      - AIPASS_ADMIN=1
      # Reaching the bridge through a hostname other than localhost (a reverse
      # proxy, say) needs that name listed here — it is refused otherwise.
      - AIPASS_ALLOWED_HOSTS=${AIPASS_ALLOWED_HOSTS:-}
      - noVNC_PASSWORD=${noVNC_PASSWORD:-}
      # Discord gets native rich status cards; other endpoints get text. The
      # bridge itself remains loopback-only.
      - AIPASS_ALERT_WEBHOOK_URL=${AIPASS_ALERT_WEBHOOK_URL:-}
      - AIPASS_ALERT_INCLUDE_INFO=${AIPASS_ALERT_INCLUDE_INFO:-1}
      - AIPASS_ALERT_COOLDOWN_SECONDS=${AIPASS_ALERT_COOLDOWN_SECONDS:-900}
      - AIPASS_WATCHDOG_INTERVAL_SECONDS=${AIPASS_WATCHDOG_INTERVAL_SECONDS:-30}
      - AIPASS_WATCHDOG_STUCK_JOB_MS=${AIPASS_WATCHDOG_STUCK_JOB_MS:-960000}
    shm_size: '2gb'
